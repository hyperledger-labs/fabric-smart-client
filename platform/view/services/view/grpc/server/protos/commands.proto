syntax = "proto3";

option go_package = "github.com/hyperledger-labs/fabric-smart-client/platform/view/services/view/grpc/server/protos";

package protos;

import "google/protobuf/timestamp.proto";

// CallView runs the view registered under fid on input and returns its result.
message CallView {
    string fid = 1;

    bytes input = 2;
}

// CallViewResponse carries the result of a CallView: the view's return value, as raw bytes
// when the view returns []byte and JSON otherwise. On a stream, it also frames the messages
// the view and the client exchange.
message CallViewResponse {
    bytes result = 1;
}

// Header is a generic replay prevention and identity message to include in a signed command
message Header {
    // Timestamp is the local time when the message was created
    // by the sender
    google.protobuf.Timestamp timestamp = 1;

    // Nonce is a sufficiently long random value
    // used to ensure the request has enough entropy.
    bytes nonce = 3;

    // Creator of the message.
    bytes creator = 4;

    // TlsCertHash is the SHA-256 of the client's TLS certificate. The view service requires
    // it to match the connection's client certificate whenever the listener verified one.
    bytes tls_cert_hash = 5;
}

// Command describes the type of operation that a client is requesting.
message Command {
    reserved 2;
    reserved "initiateView";

    // Header is the header of this command
    Header header = 1;

    // Payload is the payload of this command.
    oneof payload {
        CallView callView = 3;
    }
}

// SignedCommand is a command that carries the signature of the command's creator.
message SignedCommand {
    // Command is the serialised version of a Command message
    bytes command = 1;

    // Signature is the signature over command
    bytes signature = 2;
}

message CommandResponseHeader {
    // Timestamp is the time that the message
    // was created as  defined by the sender
    google.protobuf.Timestamp timestamp = 1;

    // CommandHash is the hash computed on the concatenation of the SignedCommand's command and signature fields.
    // If not specified differently, SHA256 is used
    // The hash is used to link a response with its request, both for bookkeeping purposes on an
    // asynchronous system and for security reasons (accountability, non-repudiation)
    bytes command_hash = 2;

    // Creator is the identity of the party creating this message
    bytes creator = 3;
}

// Error reports an application error
message Error {
    // Message associated with this response.
    string message = 1;

    // Payload that can be used to include metadata with this response.
    bytes payload = 2;
}

// A CommandResponse is returned from a server to the command submitter.
message CommandResponse {
    reserved 3;
    reserved "initiateViewResponse";

    // Header of the response.
    CommandResponseHeader header = 1;

    // Payload of the response.
    oneof payload {
        Error err = 2;
        CallViewResponse callViewResponse = 4;
    }
}

// SignedCommandResponse is a signed command response
message SignedCommandResponse {
    // Response is the serialised version of a CommandResponse message
    bytes response = 1;

    // Signature is the signature over command
    bytes signature = 2;
}