name: "CodeQL"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    - cron: '39 22 * * 5'

# A newer push to the same PR makes the in-flight analysis obsolete, so cancel
# it. Non-PR events (main pushes, the weekly schedule) fall back to run_id, which
# is unique per run, so they each get their own group and are never cancelled by
# -- or queued behind -- another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "**/*.sum"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # ratchet:github/codeql-action/init@codeql-bundle-v2.26.3
        with:
          languages: go
          build-mode: manual

      # The CodeQL tracer runs the Go extractor before every traced `go` build
      # or test command; the extractor loads and type-checks the named packages
      # from source itself, so nothing has to be compiled:
      # - Only for `go test` does the extractor include the _test.go files.
      # - `-n` makes `go test` print its build commands instead of running
      #   them, so compile errors do not fail this step; the utest jobs catch
      #   those. Its output is several MB of commands, so it is discarded, and
      #   on failure `go list -test` reports the package loading errors.
      # - The extractor hands the flags before the first package pattern to
      #   `go list` and gives up on any it cannot parse, such as `-run`,
      #   `-count` or `-C`, while the traced command still succeeds. Keep test
      #   flags out, and enter a module with `cd`.
      # One command per module extracts what `make unit-tests` covers.
      - name: Extract the Go code
        shell: bash
        run: |
          extract() { go test -n "$@" &> /dev/null || { go list -test "$@" > /dev/null; return 1; }; }
          extract ./...
          (cd integration && extract ./nwo/... ./fabric/common/...)
          (cd platform/view/services/comm/host/libp2p && extract ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # ratchet:github/codeql-action/analyze@codeql-bundle-v2.26.3
        with:
          category: "/language:go"
