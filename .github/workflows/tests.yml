name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# A newer push to the same pull request makes the in-flight run obsolete, so
# cancel it -- this workflow fans out to the whole itest matrix, so a superseded
# run holds a large share of the concurrency allowance. Non-pull-request events
# (pushes to main, manual dispatch) fall back to run_id, which is unique per run,
# so they each get their own group and are never cancelled by -- or queued behind
# -- another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One entry per `make unit-tests` module, on its own runner.
  utest:
    name: utest-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: root
            target: unit-tests-root
            coverage: true
          - suite: postgres
            target: unit-tests-postgres
            coverage: true
            database: true
          # No coverage: filter-coverage.sh drops every path under /integration/.
          - suite: integration
            target: unit-tests-integration
            fabric: true
          - suite: extensions
            target: unit-tests-extensions
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "**/*.sum"

      - name: Set up the database
        if: matrix.database
        run: make pull-images-database

      - name: Set up Fabric
        if: matrix.fabric
        run: make install-fabric-bins

      - name: Run the unit tests
        run: GO_TEST_PARAMS=-race COVERAGE=${{ matrix.coverage }} make ${{ matrix.target }}

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # ratchet:coverallsapp/github-action@v2.3.8
        if: matrix.coverage
        with:
          file: coverage.profile
          flag-name: utest-${{ matrix.suite }}
          parallel: true
          fail-on-error: false

  itest-list:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.set-itest-tests.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: list itest targets
        id: set-itest-tests
        run: |
          echo "tests=$(make list-integration-tests | jq -R . | jq -s -c .)" >> $GITHUB_OUTPUT

  itest:
    needs:
      - itest-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # run all test as listed via `make list-integration-tests`
        tests: ${{ fromJson(needs.itest-list.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        id: setup-go
        with:
          go-version-file: "go.mod"
          # setup-go keeps one cache entry for all jobs with the same Go
          # version and go.sum files, so it holds whatever the first job saved
          # and none of the -race/-coverpkg builds below. This job manages its
          # own cache.
          cache: false

      # One Go cache serves every integration target: the suites compile
      # mostly the same dependencies, and a cache per target would multiply a
      # ~400 MB entry by the size of the matrix. Cached dependencies stay valid
      # until go.sum or the Go version changes. The ISO week in the key
      # refreshes the cached FSC packages weekly, and the restore key falls
      # back to the newest entry for the same go.sum, so a build recompiles
      # only what changed since that entry was saved.
      - name: Compute the Go cache key
        id: go-cache
        run: |
          prefix="itest-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go cache
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.key }}
          restore-keys: ${{ steps.go-cache.outputs.prefix }}

      - name: Install ginkgo
        run: cd tools && go install github.com/onsi/ginkgo/v2/ginkgo

      - name: Set up Fabric
        if: startsWith(matrix.tests, 'fabric-')
        run: |
          make -j4 install-fabric-bins pull-images-database

      - name: Set up the legacy chaincode builder
        # pull-images-fabric serve only the legacy source-packaging which is used it fabric-atsa
        if: matrix.tests == 'fabric-atsa'
        run: make -j4 pull-images-fabric

      - name: Set up Fabric-x
        if: startsWith(matrix.tests, 'fabricx-')
        run: |
          make -j4 install-fabricx-tools pull-images-fabricx pull-images-database

      - name: Set up Softhsm
        # we only need this for a subset of integration tests
        if: endsWith(matrix.tests, 'hsm')
        run: |
          make install-softhsm
          ./ci/scripts/setup_softhsm.sh

      - name: Set up monitoring
        # we only need this for a subset of integration tests
        if: contains(fromJSON('["fabric-iou", "fabric-iou-libp2p", "fabric-runtimeconfig", "fsc-stoprestart"]'), matrix.tests)
        run: |
          make -j4 pull-images-monitoring

      - name: Build chaincode images
        if: startsWith(matrix.tests, 'fabric-')
        run: make chaincode-images

      - name: Run the integration test
        run: |
          mkdir -p covdata
          GOCOVERDIR=$(realpath covdata) make integration-tests-${{ matrix.tests }}
          go tool covdata textfmt -i=covdata -o coverage.profile
          ./scripts/filter-coverage.sh coverage.profile coverage.profile

      # A single writer, fabric-iou on main, keeps the matrix from uploading
      # near-identical copies; pull requests read main's entry. fabric-iou
      # builds both flavours the Fabric suites need: the plain ginkgo test
      # binary and the -race/-coverpkg node binaries; Fabric-x jobs rebuild
      # only their own extra packages. The name must stay a target of
      # `make list-integration-tests`, or nothing saves the cache and every
      # job builds cold again. The save runs only after a passing
      # test, when every binary has been built; a failed run leaves the key
      # free for the next push to main.
      - name: Save the Go cache
        if: >-
          matrix.tests == 'fabric-iou'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.key }}

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # ratchet:coverallsapp/github-action@v2.3.8
        with:
          file: coverage.profile
          flag-name: itest-${{ matrix.tests }}
          parallel: true
          fail-on-error: false

  publish-coverage:
    needs:
      - utest
      - itest
    runs-on: ubuntu-latest
    steps:
      # Close the parallel Coveralls build. Every job that reports a flag runs
      # unconditionally (neither matrix has job-level skips; the utest
      # integration entry reports no flag by design), so all flags are present
      # and no `carryforward` is needed. Omitting carryforward is deliberate: it
      # previously masked missing integration-test jobs by silently reusing a
      # prior build's coverage, so an incomplete run reported a stale-but-
      # plausible number instead of an obviously low one.
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # ratchet:coverallsapp/github-action@v2.3.8
        with:
          parallel-finished: true
          fail-on-error: false
