name: Mixed versions

# Runs integration/fabric/mixedversion: nodes of the latest release tag other than
# one at HEAD next to nodes built from HEAD (see FSC_PREVIOUS_RELEASE in the
# Makefile). It builds a second set of node binaries, so it runs nightly, on
# demand, and on pull requests that touch the suite, the release build, or what
# two releases share: the SQL stores and their schema steps, the stream preamble
# and the wire and stored messages. A failed nightly run, or a manual run with
# report, opens or comments on the issue the report job keeps; the next
# successful reported run closes it.
on:
  schedule:
    # Nightly, off the round minute and away from the fixtures and fuzz runs.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Report the result on the tracking issue, as a nightly run does'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mixedversion.yml'
      - 'integration/fabric/mixedversion/**'
      - 'integration/nwo/fsc/release.go'
      - 'platform/fabric/services/db/driver/sql/**'
      - 'platform/view/services/storage/driver/sql/**'
      - 'platform/view/services/comm/preamble/**'
      - 'platform/fabric/protos/**'
      - 'platform/fabricx/protos/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  previous-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "**/*.sum"

      - name: Install ginkgo
        run: cd tools && go install github.com/onsi/ginkgo/v2/ginkgo

      - name: Set up Fabric
        run: make -j4 install-fabric-bins pull-images-database

      - name: Build chaincode images
        run: make chaincode-images

      # ponytail: v0.28.0 predates the suite, so every spec would skip against it. Until the
      # previous release contains the views, run them from a checkout of that release with
      # HEAD's copy added: the views change only compatibly, so this is the copy the next
      # release ships. Remove this step once v0.29.0 is tagged.
      - name: Add the suite's views to a release that predates them
        run: |
          prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --no-contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          views=integration/fabric/mixedversion/views
          if [ -z "$(git ls-tree "$prev" "$views")" ]; then
            git worktree add --detach "$RUNNER_TEMP/previous" "$prev"
            mkdir -p "$RUNNER_TEMP/previous/$views"
            cp "$views"/*.go "$RUNNER_TEMP/previous/$views/"
            echo "FSC_PREVIOUS_RELEASE=$RUNNER_TEMP/previous" >> "$GITHUB_ENV"
          fi

      - name: Run the mixed-version suite
        run: make integration-tests-fabric-mixedversion

  # Keeps one open issue per failure streak: a failed run opens it or comments on it, a
  # successful run closes it. Pull request runs never report.
  report:
    needs: previous-release
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Mixed versions nightly run failed
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.previous-release.result }}
    steps:
      - name: Open, comment on or close the tracking issue
        run: |
          issue=$(gh issue list --state open --label testing --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ "$RESULT" = success ]; then
            [ -z "$issue" ] || gh issue close "$issue" --comment "Passed again in $RUN."
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again in $RUN."
          else
            gh issue create --title "$TITLE" --label testing --label ci --body "The \`Mixed versions\` workflow failed in $RUN. The next successful nightly run, or manual run with report, closes this issue."
          fi
